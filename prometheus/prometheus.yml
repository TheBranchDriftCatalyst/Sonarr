global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sonarr'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sonarr:8989']
    # If Sonarr requires authentication for metrics endpoint
    # basic_auth:
    #   username: 'your-username'
    #   password: 'your-api-key'
